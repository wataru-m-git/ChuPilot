version: '3.8'

services:
  app:
    build: .
    container_name: chupilot-app
    ports:
      - "3333:3333"
    volumes:
      - ./data:/app/data
    env_file: 
      - .env.local
    environment:
      - DATABASE_URL=file:/app/data/mouse_colony.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3333"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
